name: Django Test

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    env:
      DJANGO_SECRET_KEY: nothing-to-see-here
      DATABASE_HOST: localhost
      DATABASE_NAME: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      WEBSITE_HOSTNAME: localhost:8000
      CUSTOM_HOSTNAME: testdomain
      FRONTEND_HOSTNAME: localhost:3000
      DB_IGNORE_SSL: "true"
    services:
      postgres_main:
        image: postgres:13
        env:
          POSTGRES_DB: ${{ env.DATABASE_NAME }}
          POSTGRES_USER: ${{ env.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ env.DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          # python -m pip install --upgrade pip
          # pip install 'setuptools<72.0.0'
          pip install -I --force-reinstall setuptools==71.0.0
          pip install --no-build-isolation --no-cache-dir -r requirements.txt
          # pip install -r requirements.txt
          pip install flake8
      - name: Look for major issues with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Make sure Python code is all compilable
        run: |
          python -m compileall backend -f
          python -m compileall users -f
          python -m compileall minds -f
          python -m compileall rag -f
      - name: Run Django server
        run: |
          python manage.py migrate
          python manage.py runserver &
        env:
          DBNAME: postgres
          DBHOST: localhost
          DBUSER: postgres
          DBPASS: postgres
          SECRET_KEY: django-insecure-key-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run Tests
        run: |
          python manage.py test
