name: Sign-off

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Every commit is signed off (DCO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check each commit for a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line. See CONTRIBUTING.md."
              missing=1
            fi
          done
          exit $missing
