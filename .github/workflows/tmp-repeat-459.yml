name: tmp-repeat-459
on:
  push:
    branches: [fix/459-window-resize]
jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        spec: [naming, sidebarHide, mindLayout]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:smoke -- e2e/${{ matrix.spec }}.spec.ts --repeat-each=20 --reporter=list
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repeat-${{ matrix.spec }}
          path: test-results/
